name: Validate academy redesign
on:
  push:
    branches: [develop, feature/stitch-academy-redesign]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build -- --base-href /aafxx-angular/
      - run: npx playwright install --with-deps chromium
      - run: npm run prerender
      - run: SITE_ORIGIN=https://subair71.github.io node scripts/check-seo.mjs
      - run: node scripts/check-ui.mjs
      - run: node scripts/check-accessibility.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academy-redesign-review
          path: |
            dist/aafxx/browser
            screenshots

