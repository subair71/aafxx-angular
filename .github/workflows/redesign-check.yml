name: Validate AAFXX academy and shop
on:
  push:
    branches: [develop, dev-aafxx, feature/stitch-academy-redesign]
  pull_request:
    branches: [develop, main, dev-aafxx]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: /
      SITE_ENVIRONMENT: development
      PAYMENT_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:config
      - run: npm run check:commerce
      - run: npm ci --prefix backend
      - run: npm --prefix backend test
      - run: npm run build -- --base-href /
      - run: npx playwright install --with-deps chromium
      - run: npm run prerender
      - run: npm run check:seo -- --preview
      - run: npm run check:ui
      - run: npm run check:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aafxx-shop-validation
          path: |
            dist/aafxx/browser
            screenshots
